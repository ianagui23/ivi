    // =========================================================================
    // SUB-MODULE 4: ADAPTACIÓN IMPUESTOS BOLIVIA (SIAT)
    // =========================================================================
    function SIATModule({ sales, setSales, products, setProducts, showToast, setActiveInvoice, isAdmin, broadcastCloudEvent }) {
      const [filterDate, setFilterDate] = useState('all');

      const rcvSales = useMemo(() => {
        const todayStr = new Date().toISOString().slice(0, 10);
        const thisMonthStr = new Date().toISOString().slice(0, 7);

        return sales.filter((s) => {
          const sDate = s.date.slice(0, 10);
          if (filterDate === 'today') return sDate === todayStr;
          if (filterDate === 'month') return s.date.slice(0, 7) === thisMonthStr;
          return true;
        });
      }, [sales, filterDate]);

      const rcvTotals = useMemo(() => {
        let totalVenta = 0;
        let totalBase = 0;
        let totalDebito = 0;

        rcvSales.forEach(s => {
          if (s.status === 'V') {
            totalVenta += s.total;
            totalBase += s.taxBase;
            totalDebito += s.ivaTax;
          }
        });

        return { totalVenta, totalBase, totalDebito };
      }, [rcvSales]);

      const handleVoidInvoice = (saleId, invNumber) => {
        if (!isAdmin) return;

        if (confirm(`¿Está seguro de ANULAR la factura SIAT N° ${invNumber}?`)) {
          const targetSale = sales.find(s => s.id === saleId);
          if (!targetSale) return;

          const updatedProducts = products.map(prod => {
            const soldItem = targetSale.items.find(it => it.productId === prod.id);
            if (!soldItem) return prod;

            let restoredStock = prod.stock + soldItem.quantity;
            let restoredSizes = prod.sizes ? { ...prod.sizes } : null;

            if (soldItem.size && restoredSizes && restoredSizes[soldItem.size] !== undefined) {
              restoredSizes[soldItem.size] += soldItem.quantity;
            }

            return { ...prod, stock: restoredStock, sizes: restoredSizes };
          });

          const updatedSales = sales.map(s => s.id === saleId ? { ...s, status: 'A' } : s);

          setProducts(updatedProducts);
          setSales(updatedSales);
          broadcastCloudEvent('UPDATE_PRODUCTS', { products: updatedProducts });
          showToast(`Factura SIAT N° ${invNumber} Anulada y stock devuelto`, 'info');
        }
      };

      const exportRCV_CSV = () => {
        const headers = ['NRO', 'FECHA_FACTURA', 'NRO_FACTURA', 'COD_AUTORIZACION_CUF', 'NIT_CI_CLIENTE', 'COMPLEMENTO', 'RAZON_SOCIAL_CLIENTE', 'IMPORTE_TOTAL_VENTA', 'IMPORTE_ICE', 'OPERACIONES_EXENTAS', 'VENTAS_TASA_CERO', 'SUBTOTAL', 'DESCUENTOS_REBAJAS', 'IMPORTE_GIFT_CARD', 'IMPORTE_BASE_DEBITO_FISCAL', 'DEBITO_FISCAL_IVA_13', 'ESTADO', 'CODIGO_CONTROL'];
        const rows = rcvSales.map((s, idx) => [
          idx + 1, s.date.slice(0, 10), s.invoiceNumber, `"${s.cuf}"`, `"${s.customer.nitCi}"`, `"${s.customer.complement || ''}"`, `"${s.customer.businessName.replace(/"/g, '""')}"`, s.total.toFixed(2), '0.00', '0.00', '0.00', s.subtotal.toFixed(2), s.discount.toFixed(2), '0.00', s.status === 'V' ? s.taxBase.toFixed(2) : '0.00', s.status === 'V' ? s.ivaTax.toFixed(2) : '0.00', s.status, s.controlCode || ''
        ]);

        const csvContent = '\uFEFF' + [headers.join(';'), ...rows.map(r => r.join(';'))].join('\n');
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `SIAT_Libro_Ventas_RCV_apto_${new Date().toISOString().slice(0, 10)}.csv`;
        a.click();
        showToast('Libro de Ventas SIAT exportado a CSV', 'success');
      };

      return (
        <div className="space-y-6">
          <div className="bg-white p-5 rounded-2xl shadow-sm border border-stone-200 flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div>
              <div className="flex items-center space-x-2">
                <span className="p-2 rounded-xl bg-blue-100 text-blue-800">
                  <Icon name="receipt" className="w-5 h-5" />
                </span>
                <h2 className="text-xl font-black text-stone-900 tracking-tight">
                  Facturación Electrónica SIAT & Libro de Ventas (RCV)
                </h2>
                <span className="text-xs bg-blue-100 text-blue-900 font-bold px-2.5 py-0.5 rounded-full">
                  Bolivia SIN
                </span>
              </div>
              <p className="text-xs text-stone-500 mt-1">Conformidad con RND de Impuestos Nacionales de Bolivia</p>
            </div>

            <button
              onClick={exportRCV_CSV}
              className="px-4 py-2 rounded-xl bg-emerald-700 hover:bg-emerald-800 text-white text-xs font-bold transition flex items-center space-x-1.5 shadow-sm"
            >
              <Icon name="download" className="w-4 h-4" />
              <span>Exportar RCV (Formato SIAT)</span>
            </button>
          </div>

          {/* Cards */}
          <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
            <div className="bg-white p-4 rounded-2xl shadow-sm border border-stone-200">
              <span className="text-[11px] font-bold text-stone-500 uppercase">Total Facturado</span>
              <p className="text-2xl font-black text-stone-900 mt-1">{formatBs(rcvTotals.totalVenta)}</p>
            </div>
            <div className="bg-white p-4 rounded-2xl shadow-sm border border-stone-200">
              <span className="text-[11px] font-bold text-stone-500 uppercase">Base Crédito Fiscal</span>
              <p className="text-2xl font-black text-blue-800 mt-1">{formatBs(rcvTotals.totalBase)}</p>
            </div>
            <div className="bg-white p-4 rounded-2xl shadow-sm border border-stone-200">
              <span className="text-[11px] font-bold text-stone-500 uppercase">Débito Fiscal IVA (13%)</span>
              <p className="text-2xl font-black text-red-700 mt-1">{formatBs(rcvTotals.totalDebito)}</p>
            </div>
          </div>

          {/* Table */}
          <div className="bg-white rounded-2xl shadow-sm border border-stone-200 overflow-hidden">
            <div className="overflow-x-auto">
              <table className="w-full text-left text-xs text-stone-700">
                <thead className="bg-stone-100 border-b border-stone-200 font-bold uppercase text-[10px]">
                  <tr>
                    <th className="py-3 px-3">N° Factura</th>
                    <th className="py-3 px-3">Fecha y Hora</th>
                    <th className="py-3 px-3">NIT / C.I.</th>
                    <th className="py-3 px-3">Razón Social Comprador</th>
                    <th className="py-3 px-3 text-right">Total Venta</th>
                    <th className="py-3 px-3 text-right">IVA (13%)</th>
                    <th className="py-3 px-3 text-center">Estado</th>
                    <th className="py-3 px-3 text-center">Acciones</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-stone-100 font-medium">
                  {rcvSales.map((sale) => (
                    <tr key={sale.id} className="hover:bg-stone-50">
                      <td className="py-3 px-3 font-mono font-bold text-amberGold-600">#{sale.invoiceNumber}</td>
                      <td className="py-3 px-3 text-[11px] text-stone-600">{formatDate(sale.date)}</td>
                      <td className="py-3 px-3 font-mono font-bold">{sale.customer.nitCi}</td>
                      <td className="py-3 px-3 font-bold text-stone-800 uppercase">{sale.customer.businessName}</td>
                      <td className="py-3 px-3 text-right font-black text-stone-900">{formatBs(sale.total)}</td>
                      <td className="py-3 px-3 text-right font-bold text-blue-700">{sale.status === 'V' ? formatBs(sale.ivaTax) : '0.00'}</td>
                      <td className="py-3 px-3 text-center">
                        <span className={`inline-block font-black text-[10px] px-2 py-0.5 rounded-full ${
                          sale.status === 'V' ? 'bg-emerald-100 text-emerald-800' : 'bg-red-100 text-red-700'
                        }`}>
                          {sale.status === 'V' ? 'VÁLIDA' : 'ANULADA'}
                        </span>
                      </td>
                      <td className="py-3 px-3 text-center">
                        <div className="flex items-center justify-center space-x-1.5">
                          <button
                            onClick={() => setActiveInvoice(sale)}
                            className="p-1.5 rounded-lg bg-stone-100 hover:bg-stone-200"
                            title="Ver e Imprimir"
                          >
                            <Icon name="printer" className="w-3.5 h-3.5" />
                          </button>
                          {isAdmin && sale.status === 'V' && (
                            <button
                              onClick={() => handleVoidInvoice(sale.id, sale.invoiceNumber)}
                              className="p-1.5 rounded-lg bg-stone-100 hover:bg-red-100 text-red-700"
                              title="Anular"
                            >
                              <Icon name="trash" className="w-3.5 h-3.5" />
                            </button>
                          )}
                        </div>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      );
    }

    // =========================================================================
    // MODAL FACTURA ELECTRÓNICA SIAT CON QR OFICIAL
    // =========================================================================
    function InvoiceModal({ invoice, onClose, format, setFormat }) {
      const qrRef = useRef(null);

      useEffect(() => {
        if (!qrRef.current) return;
        qrRef.current.innerHTML = '';

        const qrContent = `https://siat.impuestos.gob.bo/consulta/QR?nit=1028495028&cuf=${invoice.cuf}&numero=${invoice.invoiceNumber}&t=${invoice.total.toFixed(2)}`;

        if (window.QRCode) {
          new window.QRCode(qrRef.current, {
            text: qrContent,
            width: format === 'ticket' ? 120 : 130,
            height: format === 'ticket' ? 120 : 130,
            colorDark: '#000000',
            colorLight: '#ffffff',
            correctLevel: window.QRCode.CorrectLevel.M
          });
        }
      }, [invoice, format]);

      return (
        <div className="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 overflow-y-auto">
          <div className="bg-white rounded-3xl max-w-lg w-full border border-stone-200 shadow-2xl overflow-hidden my-6">
            
            <div className="p-3 bg-stone-900 text-white flex items-center justify-between no-print">
              <div className="flex items-center space-x-2">
                <Icon name="receipt" className="w-4 h-4 text-amberGold-400" />
                <span className="font-bold text-xs">Visor SIAT</span>
                <div className="flex bg-stone-800 rounded-lg p-0.5 ml-2 text-[10px]">
                  <button
                    onClick={() => setFormat('ticket')}
                    className={`px-2 py-0.5 rounded font-bold ${format === 'ticket' ? 'bg-amberGold-600 text-brand-950' : 'text-stone-300'}`}
                  >
                    Ticket (80mm)
                  </button>
                  <button
                    onClick={() => setFormat('letter')}
                    className={`px-2 py-0.5 rounded font-bold ${format === 'letter' ? 'bg-amberGold-600 text-brand-950' : 'text-stone-300'}`}
                  >
                    Carta (A4)
                  </button>
                </div>
              </div>

              <div className="flex items-center space-x-2">
                <button
                  onClick={() => window.print()}
                  className="px-3 py-1 rounded-lg bg-emerald-700 hover:bg-emerald-800 text-white text-xs font-bold transition flex items-center space-x-1"
                >
                  <Icon name="printer" className="w-3.5 h-3.5" />
                  <span>Imprimir</span>
                </button>
                <button onClick={onClose} className="text-stone-400 hover:text-white p-1">
                  <Icon name="x" className="w-4 h-4" />
                </button>
              </div>
            </div>

            {/* Printable Invoice */}
            <div
              id="printable-receipt-area"
              className={`p-6 bg-white text-black font-mono select-all text-xs ${
                format === 'ticket' ? 'max-w-[340px] mx-auto text-[11px]' : 'max-w-full'
              }`}
            >
              <div className="text-center space-y-1 pb-3 border-b border-black">
                <h2 className="font-black text-base tracking-widest uppercase">FACTURA</h2>
                <p className="text-[10px] font-bold tracking-tight">CON DERECHO A CRÉDITO FISCAL</p>
                <div className="pt-1">
                  <h3 className="font-black text-sm uppercase">APTO ARTÍCULOS DE CUERO S.R.L.</h3>
                  <p className="text-[10px]">Casa Matriz: N° 0 • Av. 20 de Octubre N° 2185</p>
                  <p className="text-[10px]">Teléfono: (+591) 2-2435678 • La Paz - Bolivia</p>
                </div>
              </div>

              <div className="py-2.5 border-b border-black space-y-0.5 text-[10px]">
                <div className="flex justify-between">
                  <span className="font-bold">NIT EMISOR:</span>
                  <span>1028495028</span>
                </div>
                <div className="flex justify-between">
                  <span className="font-bold">FACTURA N°:</span>
                  <span className="font-black text-xs">{invoice.invoiceNumber}</span>
                </div>
                <div className="flex justify-between">
                  <span className="font-bold">CÓD. AUTORIZACIÓN:</span>
                  <span className="font-mono text-[9px] break-all">{invoice.cuf.slice(0, 20)}...</span>
                </div>
              </div>

              <div className="py-2.5 border-b border-black space-y-0.5 text-[10px]">
                <div className="flex justify-between">
                  <span className="font-bold">FECHA / HORA:</span>
                  <span>{formatDate(invoice.date)}</span>
                </div>
                <div className="flex justify-between">
                  <span className="font-bold">NIT / CI CLIENTE:</span>
                  <span className="font-bold">
                    {invoice.customer.nitCi}
                    {invoice.customer.complement && `-${invoice.customer.complement}`}
                  </span>
                </div>
                <div className="flex justify-between">
                  <span className="font-bold">SEÑOR(ES):</span>
                  <span className="font-bold uppercase text-right max-w-[200px] truncate">
                    {invoice.customer.businessName}
                  </span>
                </div>
              </div>

              <div className="py-2.5 border-b border-black">
                <div className="flex justify-between font-bold text-[9px] uppercase pb-1 border-b border-dotted border-stone-400">
                  <span>Cant. / Detalle</span>
                  <span>Subtotal</span>
                </div>
                <div className="space-y-1.5 pt-1.5">
                  {invoice.items.map((it, idx) => (
                    <div key={idx} className="text-[10px]">
                      <div className="flex justify-between font-bold">
                        <span>
                          {it.quantity} x {it.name}
                          {it.size && ` (Talla ${it.size})`}
                        </span>
                        <span>{it.subtotal.toFixed(2)}</span>
                      </div>
                      <div className="text-[9px] text-stone-600 flex justify-between">
                        <span>SKU: {it.sku}</span>
                        <span>P.U.: {it.unitPrice.toFixed(2)}</span>
                      </div>
                    </div>
                  ))}
                </div>
              </div>

              <div className="py-2.5 border-b border-black space-y-1 text-[10px]">
                <div className="flex justify-between font-bold">
                  <span>SUBTOTAL BS:</span>
                  <span>{invoice.subtotal.toFixed(2)}</span>
                </div>
                {invoice.discount > 0 && (
                  <div className="flex justify-between">
                    <span>DESCUENTO BS:</span>
                    <span>-{invoice.discount.toFixed(2)}</span>
                  </div>
                )}
                <div className="flex justify-between font-black text-xs pt-1 border-t border-black">
                  <span>TOTAL FACTURADO BS:</span>
                  <span>{invoice.total.toFixed(2)}</span>
                </div>
                <div className="flex justify-between text-[9px]">
                  <span>BASE CRÉDITO FISCAL BS:</span>
                  <span>{invoice.taxBase.toFixed(2)}</span>
                </div>
                <p className="text-[9px] font-bold pt-1 uppercase">
                  SON: {numeroALetrasBolivianas(invoice.total)}
                </p>
              </div>

              <div className="pt-3 text-center space-y-2">
                <div className="text-[9px]">
                  <p className="font-bold">CÓDIGO DE CONTROL: {invoice.controlCode}</p>
                  <p className="break-all font-mono text-[8px] text-stone-700">CUF: {invoice.cuf}</p>
                </div>

                <div className="flex justify-center py-1">
                  <div ref={qrRef} className="p-1.5 bg-white border border-stone-300 rounded inline-block"></div>
                </div>

                <div className="text-[8px] leading-tight space-y-1 font-bold pt-1 border-t border-dotted border-stone-400">
                  <p className="uppercase">{invoice.sinLegendGeneral}</p>
                  <p className="italic text-stone-800">{invoice.sinLegendSpecific}</p>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // Render App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
