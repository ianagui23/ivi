      const enteros = Math.floor(monto);
      const centavos = Math.round((monto - enteros) * 100);
      const strCentavos = centavos < 10 ? `0${centavos}` : `${centavos}`;

      const unidades = ['', 'UN', 'DOS', 'TRES', 'CUATRO', 'CINCO', 'SEIS', 'SIETE', 'OCHO', 'NUEVE'];
      const decenas = ['', 'DIEZ', 'VEINTE', 'TREINTA', 'CUARENTA', 'CINCUENTA', 'SESENTA', 'SETENTA', 'OCHENTA', 'NOVENTA'];
      const diezY = ['DIEZ', 'ONCE', 'DOCE', 'TRECE', 'CATORCE', 'QUINCE', 'DIECISEIS', 'DIECISIETE', 'DIECIOCHO', 'DIECINUEVE'];
      const veinti = ['', 'VEINTIUNO', 'VEINTIDOS', 'VEINTITRES', 'VEINTICUATRO', 'VEINTICINCO', 'VEINTISEIS', 'VEINTISIETE', 'VEINTIOCHO', 'VEINTINUEVE'];
      const centenas = ['', 'CIENTO', 'DOSCIENTOS', 'TRESCIENTOS', 'CUATROCIENTOS', 'QUINIENTOS', 'SEISCIENTOS', 'SETECIENTOS', 'OCHOCIENTOS', 'NOVECIENTOS'];

      function convertirGrupo(n) {
        let output = '';
        if (n === 100) return 'CIEN ';
        if (n > 99) {
          output += centenas[Math.floor(n / 100)] + ' ';
          n %= 100;
        }
        if (n >= 21 && n <= 29) {
          output += veinti[n - 20] + ' ';
        } else if (n >= 10 && n <= 19) {
          output += diezY[n - 10] + ' ';
        } else if (n >= 30) {
          output += decenas[Math.floor(n / 10)];
          if (n % 10 > 0) output += ' Y ' + unidades[n % 10];
          output += ' ';
        } else if (n > 0) {
          output += unidades[n] + ' ';
        }
        return output;
      }

      if (enteros === 0) return `CERO ${strCentavos}/100 BOLIVIANOS`;

      let resultado = '';
      const miles = Math.floor(enteros / 1000);
      const resto = enteros % 1000;

      if (miles === 1) {
        resultado += 'MIL ';
      } else if (miles > 1) {
        resultado += convertirGrupo(miles) + 'MIL ';
      }
      if (resto > 0) {
        resultado += convertirGrupo(resto);
      }

      return `${resultado.trim()} ${strCentavos}/100 BOLIVIANOS`;
    };

      for (let i = 0; i < 64; i++) {
        const charCode = (base.charCodeAt(i % base.length) * (i + 13) * 7) % 16;
        hash += charCode.toString(16).toUpperCase();
      }
      return hash;

      };

      const playCashSound = () => {
        try {
          const ctx = new (window.AudioContext || window.webkitAudioContext)();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(587.33, ctx.currentTime);
          osc.frequency.setValueAtTime(880, ctx.currentTime + 0.1);
          gain.gain.setValueAtTime(0.15, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
          osc.start();
          osc.stop(ctx.currentTime + 0.4);
        } catch (e) {}
      };

            channel.onmessage = (event) => {
              const { type, payload, sender } = event.data;
              if (type === 'NEW_SALE') {
                setSales(prev => [payload.sale, ...prev.filter(s => s.id !== payload.sale.id)]);
                setProducts(payload.products);
                if (payload.client) {
                  setClients(prev => {
                    const exists = prev.some(c => c.nitCi === payload.client.nitCi);
                    return exists
                      ? prev.map(c => c.nitCi === payload.client.nitCi ? payload.client : c)
                      : [payload.client, ...prev];

    // =========================================================================
    // MODAL: CLOUD DATABASE CONFIGURATION (POSTGRESQL / SUPABASE)
    // =========================================================================
    function CloudConfigModal({ cloudConfig, setCloudConfig, onClose, showToast }) {
      const [url, setUrl] = useState(cloudConfig.url || '');
      const [anonKey, setAnonKey] = useState(cloudConfig.anonKey || '');
      const [testing, setTesting] = useState(false);

      const handleTestAndSave = async (e) => {
        e.preventDefault();
        setTesting(true);

        const cleanUrl = url.trim();
        const cleanKey = anonKey.trim();

        if (!cleanUrl || !cleanKey) {
          setCloudConfig({ url: '', anonKey: '', connected: false });
          showToast('Sincronización configurada en modo Realtime Local / Red de Tienda', 'info');
          onClose();
          return;
        }

        try {
          if (window.supabase) {
            const client = window.supabase.createClient(cleanUrl, cleanKey);
            const { data, error } = await client.from('products').select('count', { count: 'exact', head: true });
            
            if (error && error.code !== 'PGRST116') {
              throw error;
            }

            setCloudConfig({ url: cleanUrl, anonKey: cleanKey, connected: true });
            showToast('¡Conexión exitosa a PostgreSQL / Supabase en la nube!', 'success');
            onClose();
          } else {
            setCloudConfig({ url: cleanUrl, anonKey: cleanKey, connected: true });
            showToast('Credenciales guardadas correctamente', 'success');
            onClose();
          }
        } catch(err) {
          setCloudConfig({ url: cleanUrl, anonKey: cleanKey, connected: false });
          showToast(`Aviso: Credenciales guardadas (Verifique si ejecutó schema.sql): ${err.message || ''}`, 'info');
          onClose();
        } finally {
          setTesting(false);
        }
      };

      return (
        <div className="fixed inset-0 z-50 bg-black/75 backdrop-blur-sm flex items-center justify-center p-4 overflow-y-auto">
          <div className="bg-white rounded-3xl max-w-lg w-full p-6 border border-stone-300 shadow-2xl">
            <div className="flex items-center justify-between pb-4 border-b border-stone-200">
              <div className="flex items-center space-x-2">
                <span className="p-2 rounded-xl bg-amberGold-100 text-brand-900">
                  <Icon name="cloud" className="w-5 h-5" />
                </span>
                <div>
                  <h3 className="text-base font-black text-stone-900">Base de Datos Centralizada en la Nube</h3>
                  <p className="text-xs text-stone-500">Conexión PostgreSQL / Supabase o Firebase</p>
                </div>
              </div>
              <button onClick={onClose} className="text-stone-400 hover:text-stone-600">
                <Icon name="x" className="w-5 h-5" />
              </button>
            </div>

            <form onSubmit={handleTestAndSave} className="py-4 space-y-4 text-xs">
              <div className="bg-amber-50 p-3 rounded-2xl border border-amber-200 text-brand-900">
                <p className="font-bold">⚡ Sincronización en Tiempo Real:</p>
                <p className="mt-0.5 text-stone-600">
                  La aplicación sincroniza en tiempo real cualquier venta o cambio de inventario en los celulares de los socios y computadoras de tienda.
                </p>
              </div>

              <div>
                <label className="block font-bold text-stone-700 uppercase mb-1">
                  Supabase Project URL:
                </label>
                <input
                  type="text"
                  placeholder="https://xyzcompany.supabase.co"
                  value={url}
                  onChange={(e) => setUrl(e.target.value)}
                  className="w-full px-3 py-2 rounded-xl border border-stone-300 bg-stone-50 font-mono text-xs"
                />
              </div>

              <div>
                <label className="block font-bold text-stone-700 uppercase mb-1">
                  Supabase Anon Public Key:
                </label>
                <input
                  type="password"
                  placeholder="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                  value={anonKey}
                  onChange={(e) => setAnonKey(e.target.value)}
                  className="w-full px-3 py-2 rounded-xl border border-stone-300 bg-stone-50 font-mono text-xs"
                />
              </div>

              <div className="pt-2 flex flex-col sm:flex-row gap-2">
                <button
                  type="button"
                  onClick={() => {
                    const blob = new Blob([document.querySelector('meta[name="apple-mobile-web-app-title"]')?.getAttribute('data-sql') || '-- Revise schema.sql en la carpeta del proyecto'], { type: 'text/sql' });
                    const a = document.createElement('a');
                    a.href = './schema.sql';
                    a.download = 'apto_schema.sql';
                    a.click();
                  }}
                  className="py-2.5 px-3 rounded-xl border border-stone-300 text-stone-700 hover:bg-stone-50 font-bold flex items-center justify-center space-x-1"
                >
                  <Icon name="download" className="w-4 h-4" />
                  <span>Descargar schema.sql</span>
                </button>
                <button
                  type="submit"
                  disabled={testing}
                  className="flex-1 py-2.5 rounded-xl bg-brand-800 hover:bg-brand-900 text-white font-bold shadow-md transition flex items-center justify-center space-x-1"
                >
                  <Icon name="check" className="w-4 h-4 text-amberGold-400" />
                  <span>{testing ? 'Verificando...' : 'Guardar y Sincronizar'}</span>
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

          id: `usr-${Date.now()}`,
          name: newUserName.trim(),
          email: emailClean,
          password: newUserPassword.trim(),
          role: newUserRole,
          isMaster: false,
          createdAt: new Date().toISOString()

        setNewUserEmail('');
        setNewUserPassword('');

    // =========================================================================
    // SUB-MODULE 1: PUNTO DE VENTA (POS & COMANDA MULTIDISPOSITIVO)
    // =========================================================================
    function POSModule({
      products,
      setProducts,
      sales,
      setSales,
      clients,
      setClients,
      cart,
      setCart,
      cartDiscount,
      setCartDiscount,
      paymentMethod,
      setPaymentMethod,
      cashPaid,
      setCashPaid,
      customerNit,
      setCustomerNit,
      customerName,
      setCustomerName,
      customerComplement,
      setCustomerComplement,
      customerEmail,
      setCustomerEmail,
      showToast,
      playCashSound,
      setActiveInvoice,
      sizeModalProduct,
      setSizeModalProduct,
      selectedSizeForModal,
      setSelectedSizeForModal,
      showBankQRModal,
      setShowBankQRModal,
      currentUser,
      broadcastCloudEvent,
      mobileCartOpen,
      setMobileCartOpen
    }) {
      const [categoryFilter, setCategoryFilter] = useState('todas');
      const [searchQuery, setSearchQuery] = useState('');
      const qrSimpleContainerRef = useRef(null);

      // Autocomplete client info based on NIT/CI
      const handleNitChange = (val) => {
        setCustomerNit(val);
        const match = clients.find(c => c.nitCi === val.trim());
        if (match) {
          setCustomerName(match.businessName);
          setCustomerComplement(match.complement || '');
          if (match.email) setCustomerEmail(match.email);
        }
      };

      // Filter products
      const filteredProducts = useMemo(() => {
        return products.filter((prod) => {
          const matchCat = categoryFilter === 'todas' || prod.category === categoryFilter;
          const q = searchQuery.toLowerCase().trim();
          const matchSearch =
            !q ||
            prod.name.toLowerCase().includes(q) ||
            prod.sku.toLowerCase().includes(q) ||
            (prod.subcategory && prod.subcategory.toLowerCase().includes(q)) ||
            (prod.material && prod.material.toLowerCase().includes(q));
          return matchCat && matchSearch;
        });
      }, [products, categoryFilter, searchQuery]);

      // Totals
      const cartSubtotal = useMemo(() => {
        return cart.reduce((sum, item) => sum + item.unitPrice * item.quantity, 0);
      }, [cart]);

      const discountValue = Number(cartDiscount) || 0;
      const cartTotal = Math.max(0, cartSubtotal - discountValue);
      const ivaAmount = cartTotal * 0.13;
      const changeAmount = paymentMethod === 'Efectivo' && Number(cashPaid) >= cartTotal
        ? Number(cashPaid) - cartTotal
        : 0;

      // Add to Cart
      const handleProductClick = (product) => {
        if (product.stock <= 0) {
          showToast('Producto agotado en inventario', 'error');
          return;
        }

        if (product.category === 'ropa') {
          setSizeModalProduct(product);
          const availableSize = CATEGORIES.ropa.sizes.find(sz => (product.sizes?.[sz] || 0) > 0) || 'M';
          setSelectedSizeForModal(availableSize);
          return;
        }

        addToCart(product, null);
      };

      const addToCart = (product, size = null) => {
        const existingIdx = cart.findIndex(
          item => item.productId === product.id && item.size === size
        );

        const currentQtyInCart = existingIdx >= 0 ? cart[existingIdx].quantity : 0;
        const maxStock = size ? (product.sizes?.[size] || 0) : product.stock;

        if (currentQtyInCart + 1 > maxStock) {
          showToast(`Stock insuficiente${size ? ` para la talla ${size}` : ''} (Máximo: ${maxStock})`, 'error');
          return;
        }

        if (existingIdx >= 0) {
          const updated = [...cart];
          updated[existingIdx].quantity += 1;
          updated[existingIdx].subtotal = updated[existingIdx].quantity * updated[existingIdx].unitPrice;
          setCart(updated);
        } else {
          setCart([
            ...cart,
            {
              productId: product.id,
              sku: product.sku,
              name: product.name,
              category: product.category,
              subcategory: product.subcategory,
              color: product.color || 'Estándar',
              material: product.material,
              size: size,
              unitCost: product.cost,
              unitPrice: product.price,
              quantity: 1,
              subtotal: product.price
            }
          ]);
        }
        showToast(`Agregado: ${product.name}${size ? ` (Talla ${size})` : ''}`, 'success');
      };

      const updateCartQuantity = (index, delta) => {
        const item = cart[index];
        const product = products.find(p => p.id === item.productId);
        if (!product) return;

        const maxStock = item.size ? (product.sizes?.[item.size] || 0) : product.stock;
        const newQty = item.quantity + delta;

        if (newQty <= 0) {
          setCart(cart.filter((_, i) => i !== index));
          return;
        }

        if (newQty > maxStock) {
          showToast(`Stock máximo disponible (${maxStock} unidades)`, 'error');
          return;
        }

        const updated = [...cart];
        updated[index].quantity = newQty;
        updated[index].subtotal = newQty * updated[index].unitPrice;
        setCart(updated);
      };

      const clearCart = () => {
        setCart([]);
        setCartDiscount(0);
        setCashPaid('');
      };

      // QR Simple generator
      useEffect(() => {
        if (showBankQRModal && qrSimpleContainerRef.current) {
          qrSimpleContainerRef.current.innerHTML = '';
          const qrPayload = `BCP|BNB|PAGO-SIMPLE|MONTO=${cartTotal.toFixed(2)}|REF=APTO-${Date.now()}`;
          if (window.QRCode) {
            new window.QRCode(qrSimpleContainerRef.current, {
              text: qrPayload,
              width: 170,
              height: 170,
              colorDark: '#321D12',
              colorLight: '#ffffff'
            });
          }
        }
      }, [showBankQRModal, cartTotal]);

      // Process Checkout & Broadcast Realtime to All Devices
      const handleCheckout = () => {
        if (cart.length === 0) {
          showToast('El carrito de compras está vacío', 'error');
          return;
        }

        if (paymentMethod === 'Efectivo') {
          const paid = Number(cashPaid);
          if (paid < cartTotal) {
            showToast(`El monto en efectivo ingresado (Bs. ${paid}) es menor al total a pagar`, 'error');
            return;
          }
        }

        // Deduct stock in real-time
        const updatedProducts = products.map(prod => {
          const cartItemsForThisProd = cart.filter(c => c.productId === prod.id);
          if (cartItemsForThisProd.length === 0) return prod;

          let newStock = prod.stock;
          let newSizes = prod.sizes ? { ...prod.sizes } : null;

          cartItemsForThisProd.forEach(ci => {
            newStock = Math.max(0, newStock - ci.quantity);
            if (ci.size && newSizes && newSizes[ci.size] !== undefined) {
              newSizes[ci.size] = Math.max(0, newSizes[ci.size] - ci.quantity);
            }
          });

          return {
            ...prod,
            stock: newStock,
            sizes: newSizes
          };
        });

        // Generate SIAT Invoice
        const invoiceNum = (sales.length > 0 ? Math.max(...sales.map(s => s.invoiceNumber || 0)) : 1000) + 1;
        const nowIso = new Date().toISOString();
        const cuf = generateCUF('1028495028', nowIso.replace(/[-:T.]/g, '').slice(0, 14), '0', '1', '1', '1', '0', invoiceNum);
        const controlCode = generateControlCode();

        const clientNitClean = customerNit.trim() || '0';
        const clientNameClean = customerName.trim().toUpperCase() || 'CONTROL TRIBUTARIO';

        const newSale = {
          id: `sal-${Date.now()}`,
          invoiceNumber: invoiceNum,
          cuf: cuf,
          controlCode: controlCode,
          date: nowIso,
          customer: {
            nitCi: clientNitClean,
            complement: customerComplement.trim().toUpperCase(),
            businessName: clientNameClean,
            email: customerEmail.trim()
          },
          items: [...cart],
          subtotal: cartSubtotal,
          discount: discountValue,
          total: cartTotal,
          taxBase: cartTotal,
          ivaTax: ivaAmount,
          paymentMethod: paymentMethod,
          amountPaid: paymentMethod === 'Efectivo' ? Number(cashPaid) : cartTotal,
          change: changeAmount,
          sellerName: currentUser ? currentUser.name : 'Vendedor',
          sellerEmail: currentUser ? currentUser.email : '',
          status: 'V',
          sinLegendGeneral: 'ESTA FACTURA CONTRIBUYE AL DESARROLLO DEL PAÍS, EL USO ILÍCITO SERÁ SANCIONADO PENALMENTE DE ACUERDO A LEY',
          sinLegendSpecific: 'Ley N° 453: El proveedor debe brindar atención sin discriminación, con trato digno y con respeto a los usuarios y consumidores.'
        };

        // Update or Register Client in Cloud
        let updatedClient = null;
        if (clientNitClean !== '0') {
          const existingClient = clients.find(c => c.nitCi === clientNitClean);
          if (existingClient) {
            updatedClient = {
              ...existingClient,
              businessName: clientNameClean,
              complement: customerComplement.trim().toUpperCase(),
              email: customerEmail.trim() || existingClient.email,
              totalPurchases: (existingClient.totalPurchases || 0) + cartTotal,
              purchaseCount: (existingClient.purchaseCount || 0) + 1,
              lastPurchaseDate: nowIso
            };
            setClients(clients.map(c => c.nitCi === clientNitClean ? updatedClient : c));
          } else {
            updatedClient = {
              id: `cli-${Date.now()}`,
              nitCi: clientNitClean,
              complement: customerComplement.trim().toUpperCase(),
              businessName: clientNameClean,
              email: customerEmail.trim(),
              phone: '',
              totalPurchases: cartTotal,
              purchaseCount: 1,
              lastPurchaseDate: nowIso,
              createdAt: nowIso
            };
            setClients([updatedClient, ...clients]);
          }
        }

        // Apply Local & Cloud States
        setProducts(updatedProducts);
        setSales([newSale, ...sales]);

        // Broadcast Live Delta to All Phones & Tablets Across the Cloud
        broadcastCloudEvent('NEW_SALE', {
          sale: newSale,
          products: updatedProducts,
          client: updatedClient
        });

        // Audio & Visual feedback
        playCashSound();
        if (window.confetti) {
          window.confetti({
            particleCount: 65,
            spread: 60,
            origin: { y: 0.7 },
            colors: ['#D97706', '#63422C', '#F59E0B', '#10B981']
          });
        }

        showToast(`¡Venta #${invoiceNum} registrada y sincronizada en tiempo real!`, 'success');
        setActiveInvoice(newSale);
        clearCart();
        setCustomerNit('');
        setCustomerName('');
        setCustomerComplement('');
        setCustomerEmail('');
        setMobileCartOpen(false);
      };

      return (
        <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 relative">
          
          {/* Left Column: Product Grid */}
          <div className="lg:col-span-7 xl:col-span-8 flex flex-col space-y-4">
            
            {/* Search and Category Filters */}
            <div className="bg-white p-4 rounded-2xl shadow-sm border border-stone-200 space-y-3">
              <div className="relative">
                <div className="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-stone-400">
                  <Icon name="search" className="w-5 h-5" />
                </div>
                <input
                  type="text"
                  placeholder="Buscar por Nombre, SKU (ej. ROP-, CAR-), Material..."
                  value={searchQuery}
                  onChange={(e) => setSearchQuery(e.target.value)}
                  className="w-full pl-10 pr-4 py-2.5 rounded-xl border border-stone-300 focus:outline-none focus:ring-2 focus:ring-brand-600 text-sm bg-stone-50"
                />
              </div>

              {/* Category Pills */}
              <div className="flex flex-wrap gap-2 pt-1">
                <button
                  onClick={() => setCategoryFilter('todas')}
                  className={`px-3.5 py-1.5 rounded-xl text-xs font-bold transition flex items-center space-x-1.5 ${
                    categoryFilter === 'todas'
                      ? 'bg-brand-800 text-white shadow-sm'
                      : 'bg-stone-100 hover:bg-stone-200 text-stone-700'
                  }`}
                >
                  <span>Todos</span>
                  <span className="opacity-70 text-[10px]">({products.length})</span>
                </button>

                {Object.values(CATEGORIES).map((cat) => (
                  <button
                    key={cat.id}
                    onClick={() => setCategoryFilter(cat.id)}
                    className={`px-3.5 py-1.5 rounded-xl text-xs font-bold transition flex items-center space-x-1.5 ${
                      categoryFilter === cat.id
                        ? 'bg-brand-800 text-white shadow-sm'
                        : 'bg-stone-100 hover:bg-stone-200 text-stone-700'
                    }`}
                  >
                    <span>{cat.name}</span>
                    <span className="opacity-70 text-[10px]">
                      ({products.filter(p => p.category === cat.id).length})
                    </span>
                  </button>
                ))}
              </div>
            </div>

            {/* Products Grid */}
            <div className="grid grid-cols-2 sm:grid-cols-3 xl:grid-cols-4 gap-3.5 overflow-y-auto max-h-[calc(100vh-270px)] pr-1 pb-16 lg:pb-0">
              {filteredProducts.map((prod) => {
                const isOutOfStock = prod.stock <= 0;
                const isLowStock = prod.stock > 0 && prod.stock <= 3;
                return (
                  <div
                    key={prod.id}
                    onClick={() => !isOutOfStock && handleProductClick(prod)}
                    className={`group bg-white rounded-2xl p-3.5 border transition-all text-left flex flex-col justify-between relative ${
                      isOutOfStock
                        ? 'opacity-60 border-stone-200 cursor-not-allowed bg-stone-50'
                        : 'border-stone-200 hover:border-brand-500 hover:shadow-md cursor-pointer active:scale-[0.98]'
                    }`}
                  >
                    <div className="flex items-center justify-between mb-2">
                      <span className="text-[10px] font-bold uppercase tracking-wider text-stone-600 bg-stone-100 px-2 py-0.5 rounded-md">
                        {prod.subcategory || prod.category}
                      </span>
                      <span
                        className={`text-[10px] font-bold px-2 py-0.5 rounded-full ${
                          isOutOfStock
                            ? 'bg-red-100 text-red-700'
                            : isLowStock
                            ? 'bg-amber-100 text-amber-800'
                            : 'bg-emerald-100 text-emerald-800'
                        }`}
                      >
                        {isOutOfStock ? 'Agotado' : `Stock: ${prod.stock}`}
                      </span>
                    </div>

                    <div>
                      <span className="text-[10px] font-mono font-bold text-amberGold-600">
                        {prod.sku}
                      </span>
                      <h4 className="text-xs sm:text-sm font-bold text-stone-900 line-clamp-2 mt-0.5 group-hover:text-brand-800">
                        {prod.name}
                      </h4>
                      {prod.material && (
                        <p className="text-[11px] text-stone-600 truncate mt-0.5">
                          {prod.material}
                        </p>
                      )}
                    </div>

                    <div className="mt-3 pt-2.5 border-t border-stone-100 flex items-center justify-between">
                      <div>
                        <span className="text-xs font-bold text-stone-500 block text-[10px] uppercase">Precio</span>
                        <span className="text-sm sm:text-base font-black text-brand-900">
                          {formatBs(prod.price)}
                        </span>
                      </div>
                      <button
                        disabled={isOutOfStock}
                        className={`w-8 h-8 rounded-xl flex items-center justify-center transition shadow-sm ${
                          isOutOfStock
                            ? 'bg-stone-200 text-stone-400'
                            : 'bg-brand-800 group-hover:bg-amberGold-600 text-white'
                        }`}
                      >
                        <Icon name="plus" className="w-4 h-4" />
                      </button>
                    </div>

                    {prod.category === 'ropa' && prod.sizes && (
                      <div className="mt-1 flex flex-wrap gap-1 text-[9px] font-bold text-stone-600">
                        {CATEGORIES.ropa.sizes.map((sz) => (
                          <span
                            key={sz}
                            className={`px-1 py-0.2 rounded border ${
                              (prod.sizes[sz] || 0) > 0 ? 'bg-stone-50 border-stone-200 text-stone-700' : 'opacity-30 line-through'
                            }`}
                          >
                            {sz}
                          </span>
                        ))}
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          </div>

          {/* Floating Mobile Cart Drawer Trigger */}
          <div className="lg:hidden fixed bottom-16 left-3 right-3 z-30">
            <button
              onClick={() => setMobileCartOpen(true)}
              className="w-full py-3 px-4 rounded-2xl bg-brand-800 text-white font-bold text-sm shadow-2xl flex items-center justify-between border border-amberGold-500/40"
            >
              <div className="flex items-center space-x-2">
                <Icon name="cart" className="w-5 h-5 text-amberGold-400" />
                <span>Comanda ({cart.reduce((s, it) => s + it.quantity, 0)} ítems)</span>
              </div>
              <div className="flex items-center space-x-2">
                <span className="text-amberGold-300 font-black">{formatBs(cartTotal)}</span>
                <span className="text-xs bg-amberGold-500 text-brand-950 px-2 py-0.5 rounded-md font-bold">Ver</span>
              </div>
            </button>
          </div>

          {/* Right Column: Checkout Comanda (Responsive Drawer on Mobile / Persistent on Desktop) */}
          <div className={`
            lg:col-span-5 xl:col-span-4 flex flex-col space-y-4
            ${mobileCartOpen ? 'fixed inset-0 z-50 bg-black/60 p-3 flex justify-end' : 'hidden lg:flex'}
          `}>
            <div className={`
              bg-white rounded-3xl shadow-2xl lg:shadow-sm border border-stone-200 flex flex-col h-full overflow-hidden w-full
              ${mobileCartOpen ? 'max-w-md ml-auto' : ''}
            `}>
              
              {/* Header */}
              <div className="p-4 bg-stone-900 text-white flex items-center justify-between border-b border-brand-800">
                <div className="flex items-center space-x-2">
                  <Icon name="cart" className="w-5 h-5 text-amberGold-400" />
                  <h3 className="font-bold text-base">Comanda / Venta Actual</h3>
                </div>
                <div className="flex items-center space-x-2">
                  {cart.length > 0 && (
                    <button
                      onClick={clearCart}
                      className="text-xs text-stone-400 hover:text-red-400 flex items-center space-x-1"
                    >
                      <Icon name="trash" className="w-3.5 h-3.5" />
                      <span>Vaciar</span>
                    </button>
                  )}
                  {mobileCartOpen && (
                    <button
                      onClick={() => setMobileCartOpen(false)}
                      className="p-1 text-stone-400 hover:text-white lg:hidden"
                    >
                      <Icon name="x" className="w-5 h-5" />
                    </button>
                  )}
                </div>
              </div>

              {/* Items List */}
              <div className="flex-1 overflow-y-auto max-h-[220px] lg:max-h-[260px] p-3 space-y-2.5 divide-y divide-stone-100">
                {cart.length === 0 ? (
                  <div className="py-8 text-center">
                    <Icon name="cart" className="w-10 h-10 text-stone-300 mx-auto mb-1" />
                    <p className="text-stone-500 font-semibold text-xs">El carrito está vacío</p>
                  </div>
                ) : (
                  cart.map((item, idx) => (
                    <div key={`${item.productId}-${item.size}-${idx}`} className="pt-2 first:pt-0 flex items-start justify-between">
                      <div className="flex-1 pr-2">
                        <div className="flex items-center space-x-1.5">
                          <span className="text-[10px] font-mono font-bold text-amberGold-600 bg-amber-50 px-1.5 py-0.5 rounded">
                            {item.sku}
                          </span>
                          {item.size && (
                            <span className="text-[10px] font-black bg-brand-800 text-white px-2 py-0.5 rounded">
                              Talla {item.size}
                            </span>
                          )}
                        </div>
                        <h5 className="text-xs font-bold text-stone-800 mt-1 line-clamp-1">{item.name}</h5>
                        <span className="text-[11px] text-stone-500">{formatBs(item.unitPrice)} c/u</span>
                      </div>

                      <div className="flex flex-col items-end space-y-1">
                        <div className="flex items-center space-x-1 bg-stone-100 rounded-lg p-0.5 border border-stone-200">
                          <button
                            onClick={() => updateCartQuantity(idx, -1)}
                            className="w-6 h-6 rounded flex items-center justify-center hover:bg-white text-stone-700"
                          >
                            <Icon name="minus" className="w-3 h-3" />
                          </button>
                          <span className="w-6 text-center text-xs font-bold">{item.quantity}</span>
                          <button
                            onClick={() => updateCartQuantity(idx, 1)}
                            className="w-6 h-6 rounded flex items-center justify-center hover:bg-white text-stone-700"
                          >
                            <Icon name="plus" className="w-3 h-3" />
                          </button>
                        </div>
                        <span className="text-xs font-black text-brand-900">{formatBs(item.subtotal)}</span>
                      </div>
                    </div>
                  ))
                )}
              </div>

              {/* Customer Form */}
              <div className="p-3.5 bg-stone-50 border-t border-stone-200 space-y-2 text-xs">
                <div className="flex items-center justify-between">
                  <span className="font-bold text-stone-700 flex items-center space-x-1">
                    <Icon name="user" className="w-3.5 h-3.5 text-brand-600" />
                    <span>Facturación SIAT Bolivia</span>
                  </span>
                  <button
                    onClick={() => {
                      setCustomerNit('0');
                      setCustomerName('CONTROL TRIBUTARIO');
                      setCustomerComplement('');
                    }}
                    className="text-[10px] text-brand-700 hover:underline font-semibold"
                  >
                    Sin Nombre / Menor
                  </button>
                </div>

                <div className="grid grid-cols-3 gap-2">
                  <div className="col-span-2">
                    <input
                      type="text"
                      placeholder="NIT / C.I. Cliente"
                      value={customerNit}
                      onChange={(e) => handleNitChange(e.target.value)}
                      className="w-full px-2.5 py-1.5 rounded-lg border border-stone-300 text-xs focus:ring-1 focus:ring-brand-600 bg-white"
                    />
                  </div>
                  <div>
                    <input
                      type="text"
                      placeholder="Compl."
                      value={customerComplement}
                      onChange={(e) => setCustomerComplement(e.target.value)}
                      className="w-full px-2.5 py-1.5 rounded-lg border border-stone-300 text-xs focus:ring-1 focus:ring-brand-600 bg-white"
                    />
                  </div>
                </div>

                <input
                  type="text"
                  placeholder="Razón Social / Nombre Completo"
                  value={customerName}
                  onChange={(e) => setCustomerName(e.target.value)}
                  className="w-full px-2.5 py-1.5 rounded-lg border border-stone-300 text-xs bg-white uppercase font-medium"
                />

                <input
                  type="email"
                  placeholder="Correo electrónico (Envío Factura Digital)"
                  value={customerEmail}
                  onChange={(e) => setCustomerEmail(e.target.value)}
                  className="w-full px-2.5 py-1.5 rounded-lg border border-stone-300 text-xs bg-white"
                />
              </div>

              {/* Payment Methods (Mandatory Always Visible) & Totals */}
              <div className="p-4 bg-brand-50 border-t border-brand-200 space-y-3">
                <div>
                  <span className="text-[11px] font-bold text-stone-700 uppercase block mb-1.5">
                    Método de Pago:
                  </span>
                  <div className="grid grid-cols-3 gap-2">
                    <button
                      type="button"
                      onClick={() => setPaymentMethod('Efectivo')}
                      className={`py-2 px-1 rounded-xl text-xs font-bold transition flex flex-col items-center justify-center space-y-1 ${
                        paymentMethod === 'Efectivo'
                          ? 'bg-brand-800 text-white shadow-md ring-2 ring-amberGold-500'
                          : 'bg-white border border-stone-300 text-stone-700 hover:bg-stone-100'
                      }`}
                    >
                      <Icon name="cash" className="w-4 h-4" />
                      <span>Efectivo</span>
                    </button>

                    <button
                      type="button"
                      onClick={() => {
                        setPaymentMethod('QR Simple');
                        setShowBankQRModal(true);
                      }}
                      className={`py-2 px-1 rounded-xl text-xs font-bold transition flex flex-col items-center justify-center space-y-1 ${
                        paymentMethod === 'QR Simple'
                          ? 'bg-brand-800 text-white shadow-md ring-2 ring-amberGold-500'
                          : 'bg-white border border-stone-300 text-stone-700 hover:bg-stone-100'
                      }`}
                    >
                      <Icon name="qr" className="w-4 h-4" />
                      <span>QR Simple</span>
                    </button>

                    <button
                      type="button"
                      onClick={() => setPaymentMethod('Tarjeta')}
                      className={`py-2 px-1 rounded-xl text-xs font-bold transition flex flex-col items-center justify-center space-y-1 ${
                        paymentMethod === 'Tarjeta'
                          ? 'bg-brand-800 text-white shadow-md ring-2 ring-amberGold-500'
                          : 'bg-white border border-stone-300 text-stone-700 hover:bg-stone-100'
                      }`}
                    >
                      <Icon name="creditCard" className="w-4 h-4" />
                      <span>Tarjeta</span>
                    </button>
                  </div>
                </div>

                {paymentMethod === 'Efectivo' && (
                  <div className="grid grid-cols-2 gap-2 bg-white p-2.5 rounded-xl border border-stone-200 text-xs">
                    <div>
                      <label className="text-[10px] text-stone-500 font-bold block mb-1">Monto Recibido (Bs.)</label>
                      <input
                        type="number"
                        min="0"
                        placeholder="0.00"
                        value={cashPaid}
                        onChange={(e) => setCashPaid(e.target.value)}
                        className="w-full px-2 py-1 rounded border border-stone-300 font-bold"
                      />
                    </div>
                    <div>
                      <span className="text-[10px] text-stone-500 font-bold block mb-1">Cambio / Vuelto</span>
                      <span className="font-black text-sm text-emerald-700 block py-1">
                        {formatBs(changeAmount)}
                      </span>
                    </div>
                  </div>
                )}

                <div className="space-y-1 text-xs">
                  <div className="flex justify-between text-stone-600">
                    <span>Subtotal:</span>
                    <span className="font-semibold">{formatBs(cartSubtotal)}</span>
                  </div>
                  <div className="flex items-center justify-between text-stone-600">
                    <span>Descuento (Bs.):</span>
                    <input
                      type="number"
                      min="0"
                      max={cartSubtotal}
                      value={cartDiscount}
                      onChange={(e) => setCartDiscount(Math.max(0, Number(e.target.value)))}
                      className="w-20 px-2 py-0.5 rounded border border-stone-300 text-right font-semibold"
                    />
                  </div>
                  <div className="flex justify-between text-blue-700 text-[11px]">
                    <span>Débito Fiscal IVA (13% inc.):</span>
                    <span className="font-bold">{formatBs(ivaAmount)}</span>
                  </div>
                  <div className="flex justify-between items-baseline pt-2 border-t border-brand-200">
                    <span className="font-black text-stone-900 text-sm">TOTAL A PAGAR:</span>
                    <span className="font-black text-xl text-brand-900">{formatBs(cartTotal)}</span>
                  </div>
                </div>

                <button
                  onClick={handleCheckout}
                  disabled={cart.length === 0}
                  className={`w-full py-3.5 rounded-xl font-black text-sm tracking-wide shadow-lg transition flex items-center justify-center space-x-2 ${
                    cart.length === 0
                      ? 'bg-stone-300 text-stone-500 cursor-not-allowed'
                      : 'bg-emerald-700 hover:bg-emerald-800 active:scale-[0.99] text-white'
                  }`}
                >
                  <Icon name="check" className="w-5 h-5" />
                  <span>Cobrar y Emitir Factura SIAT</span>
                </button>
              </div>
            </div>
          </div>

          {/* Size Modal for Clothing */}
          {sizeModalProduct && (

                  <span>Monto a cobrar: </span>
                  <span className="font-black text-brand-900 text-sm">{formatBs(cartTotal)}</span>

                <button
                  onClick={() => setShowBankQRModal(false)}

    // =========================================================================
    // SUB-MODULE 2: INVENTARIO Y TALLER (CRUD COMPLETO ADMIN / LECTURA VENDEDOR)
    // =========================================================================
    function InventoryModule({ products, setProducts, showToast, isAdmin, broadcastCloudEvent }) {
      const [categoryFilter, setCategoryFilter] = useState('todas');
      const [searchQuery, setSearchQuery] = useState('');
      const [showProductModal, setShowProductModal] = useState(false);
      const [editingProduct, setEditingProduct] = useState(null);
      const [showStockAdjustModal, setShowStockAdjustModal] = useState(false);
      const [stockAdjustProduct, setStockAdjustProduct] = useState(null);

      const filtered = useMemo(() => {
        return products.filter((prod) => {
          const matchCat = categoryFilter === 'todas' || prod.category === categoryFilter;
          const q = searchQuery.toLowerCase().trim();
          return matchCat && (
            !q ||
            prod.name.toLowerCase().includes(q) ||
            prod.sku.toLowerCase().includes(q) ||
            (prod.subcategory && prod.subcategory.toLowerCase().includes(q)) ||
            (prod.material && prod.material.toLowerCase().includes(q))
          );
        });
      }, [products, categoryFilter, searchQuery]);

      const handleDeleteProduct = (id, name) => {
        if (!isAdmin) return;
        if (confirm(`¿Eliminar el producto "${name}" del catálogo central?`)) {
          const updated = products.filter(p => p.id !== id);
          setProducts(updated);
          broadcastCloudEvent('UPDATE_PRODUCTS', { products: updated });
          showToast(`Producto "${name}" eliminado`, 'info');
        }
      };

      return (
        <div className="space-y-6">
          {!isAdmin && (
            <div className="p-3 rounded-2xl bg-amber-50 border border-amber-300 text-brand-900 text-xs font-semibold flex items-center justify-between">
              <div className="flex items-center space-x-2">
                <Icon name="eye" className="w-4 h-4 text-amber-700 flex-shrink-0" />
                <span>
                  <strong>Modo Consulta (Rol Vendedor):</strong> Puede consultar existencias y especificaciones. La edición y registro de artículos están reservados para el Administrador.
                </span>
              </div>
              <span className="px-2 py-0.5 rounded bg-amber-200 text-brand-950 font-bold text-[10px]">
                Solo Lectura
              </span>
            </div>
          )}

          {/* Header */}
          <div className="bg-white p-5 rounded-2xl shadow-sm border border-stone-200 flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div>
              <div className="flex items-center space-x-2">
                <span className="p-2 rounded-xl bg-amber-100 text-brand-800">
                  <Icon name="package" className="w-5 h-5" />
                </span>
                <h2 className="text-xl font-black text-stone-900 tracking-tight">
                  Inventario y Taller de Marroquinería
                </h2>
              </div>
              <p className="text-xs text-stone-500 mt-1">
                Catálogo centralizado en la nube para Ropa (XS-XXL), Carteras, Billeteras/Accesorios y Maletines
              </p>
            </div>

            {isAdmin && (
              <button
                onClick={() => {
                  setEditingProduct(null);
                  setShowProductModal(true);
                }}
                className="px-4 py-2 rounded-xl bg-brand-800 hover:bg-brand-900 text-white text-xs font-bold transition flex items-center space-x-2 shadow-sm"
              >
                <Icon name="plus" className="w-4 h-4 text-amberGold-400" />
                <span>Registrar Nuevo Producto</span>
              </button>
            )}
          </div>

          {/* Filters */}
          <div className="bg-white p-4 rounded-2xl shadow-sm border border-stone-200 flex flex-col sm:flex-row items-center justify-between gap-3">
            <div className="w-full sm:w-80 relative">
              <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-stone-400">
                <Icon name="search" className="w-4 h-4" />
              </div>
              <input
                type="text"
                placeholder="Buscar por SKU, Nombre o Material..."
                value={searchQuery}
                onChange={(e) => setSearchQuery(e.target.value)}
                className="w-full pl-9 pr-3 py-2 text-xs rounded-xl border border-stone-300 bg-stone-50"
              />
            </div>

            <div className="flex flex-wrap gap-1.5 w-full sm:w-auto">
              <button
                onClick={() => setCategoryFilter('todas')}
                className={`px-3 py-1.5 rounded-xl text-xs font-bold transition ${
                  categoryFilter === 'todas' ? 'bg-brand-800 text-white' : 'bg-stone-100 text-stone-600'
                }`}
              >
                Todas ({products.length})
              </button>
              {Object.values(CATEGORIES).map((cat) => (
                <button
                  key={cat.id}
                  onClick={() => setCategoryFilter(cat.id)}
                  className={`px-3 py-1.5 rounded-xl text-xs font-bold transition ${
                    categoryFilter === cat.id ? 'bg-brand-800 text-white' : 'bg-stone-100 text-stone-600'
                  }`}
                >
                  {cat.name}
                </button>
              ))}
            </div>
          </div>

          {/* Table */}
          <div className="bg-white rounded-2xl shadow-sm border border-stone-200 overflow-hidden">
            <div className="overflow-x-auto">
              <table className="w-full text-left text-xs text-stone-700">
                <thead className="bg-stone-100 border-b border-stone-200 font-bold uppercase text-stone-600 text-[10px] tracking-wider">
                  <tr>
                    <th className="py-3 px-4">Código / SKU</th>
                    <th className="py-3 px-4">Producto & Especificaciones</th>
                    <th className="py-3 px-4">Categoría</th>
                    <th className="py-3 px-4 text-right">Costo Taller</th>
                    <th className="py-3 px-4 text-right">Precio Venta</th>
                    <th className="py-3 px-4 text-center">Stock Actual</th>
                    <th className="py-3 px-4 text-center">Acciones</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-stone-100">
                  {filtered.map((prod) => (
                    <tr key={prod.id} className="hover:bg-stone-50 transition">
                      <td className="py-3.5 px-4 font-mono font-bold text-amberGold-600">
                        {prod.sku}
                      </td>
                      <td className="py-3.5 px-4 max-w-xs">
                        <span className="font-bold text-stone-900 block text-xs">{prod.name}</span>
                        <div className="text-[11px] text-stone-600 mt-0.5">
                          {prod.material} • {prod.color}
                        </div>
                        {prod.category === 'ropa' && prod.sizes && (
                          <div className="flex flex-wrap gap-1 mt-1 text-[9px] font-bold">
                            {CATEGORIES.ropa.sizes.map((sz) => (
                              <span
                                key={sz}
                                className={`px-1.5 py-0.5 rounded border ${
                                  (prod.sizes[sz] || 0) > 0 ? 'bg-amber-50 border-amber-200 text-brand-900' : 'bg-stone-100 border-stone-200 text-stone-400 line-through'
                                }`}
                              >
                                {sz}: {prod.sizes[sz] || 0}
                              </span>
                            ))}
                          </div>
                        )}
                      </td>
                      <td className="py-3.5 px-4">
                        <span className="text-[10px] font-bold uppercase px-2 py-0.5 rounded bg-stone-100 text-stone-700">
                          {prod.subcategory || prod.category}
                        </span>
                      </td>
                      <td className="py-3.5 px-4 text-right font-medium text-stone-600">
                        {formatBs(prod.cost)}
                      </td>
                      <td className="py-3.5 px-4 text-right font-black text-brand-900">
                        {formatBs(prod.price)}
                      </td>
                      <td className="py-3.5 px-4 text-center">
                        <span className={`inline-block font-black px-2.5 py-1 rounded-full text-xs ${
                          prod.stock <= 0 ? 'bg-red-100 text-red-700' : prod.stock <= 3 ? 'bg-amber-100 text-amber-800' : 'bg-emerald-100 text-emerald-800'
                        }`}>
                          {prod.stock} un.
                        </span>
                      </td>
                      <td className="py-3.5 px-4 text-center">
                        {isAdmin ? (
                          <div className="flex items-center justify-center space-x-1.5">
                            <button
                              onClick={() => {
                                setStockAdjustProduct(prod);
                                setShowStockAdjustModal(true);
                              }}
                              className="p-1.5 rounded-lg bg-stone-100 hover:bg-stone-200 text-stone-700"
                              title="Ajuste de stock"
                            >
                              <Icon name="refresh" className="w-3.5 h-3.5" />
                            </button>
                            <button
                              onClick={() => {
                                setEditingProduct(prod);
                                setShowProductModal(true);
                              }}
                              className="p-1.5 rounded-lg bg-stone-100 hover:bg-amber-100 text-stone-700"
                              title="Editar"
                            >
                              <Icon name="edit" className="w-3.5 h-3.5" />
                            </button>
                            <button
                              onClick={() => handleDeleteProduct(prod.id, prod.name)}
                              className="p-1.5 rounded-lg bg-stone-100 hover:bg-red-100 text-stone-700"
                              title="Eliminar"
                            >
                              <Icon name="trash" className="w-3.5 h-3.5" />
                            </button>
                          </div>
                        ) : (
                          <span className="text-[11px] text-stone-400 italic">Consulta</span>
                        )}
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>

          {/* Form Modal */}
          {showProductModal && isAdmin && (
            <ProductFormModal
              editingProduct={editingProduct}
              products={products}
              setProducts={(updated) => {
                setProducts(updated);
                broadcastCloudEvent('UPDATE_PRODUCTS', { products: updated });
              }}
              onClose={() => {
                setShowProductModal(false);
                setEditingProduct(null);
              }}
              showToast={showToast}
            />
          )}

          {/* Stock Adjustment Modal */}
          {showStockAdjustModal && stockAdjustProduct && isAdmin && (
            <StockAdjustmentModal
              product={stockAdjustProduct}
              products={products}
              setProducts={(updated) => {
                setProducts(updated);
                broadcastCloudEvent('UPDATE_PRODUCTS', { products: updated });
              }}
              onClose={() => {
                setShowStockAdjustModal(false);
                setStockAdjustProduct(null);
              }}
              showToast={showToast}
            />
          )}
        </div>
      );
    }

    // Modal to create/edit product (Admin Only)
    function ProductFormModal({ editingProduct, products, setProducts, onClose, showToast }) {
      const [category, setCategory] = useState(editingProduct ? editingProduct.category : 'ropa');
      const [subcategory, setSubcategory] = useState(
        editingProduct ? (editingProduct.subcategory || '') : CATEGORIES[category]?.subcategories[0] || ''
      );
      const [sku, setSku] = useState(editingProduct ? editingProduct.sku : '');
      const [name, setName] = useState(editingProduct ? editingProduct.name : '');
      const [material, setMaterial] = useState(editingProduct ? (editingProduct.material || '') : '');
      const [color, setColor] = useState(editingProduct ? (editingProduct.color || '') : '');
      const [cost, setCost] = useState(editingProduct ? editingProduct.cost : '');
      const [price, setPrice] = useState(editingProduct ? editingProduct.price : '');
      const [simpleStock, setSimpleStock] = useState(editingProduct ? editingProduct.stock : 0);
      
      const [sizesStock, setSizesStock] = useState(() => {
        if (editingProduct && editingProduct.sizes) {
          return { XS: 0, S: 0, M: 0, L: 0, XL: 0, XXL: 0, ...editingProduct.sizes };
        }
        return { XS: 0, S: 0, M: 0, L: 0, XL: 0, XXL: 0 };
      });

      const handleCategoryChange = (newCat) => {
        setCategory(newCat);
        setSubcategory(CATEGORIES[newCat]?.subcategories[0] || '');
      };

      const calculatedRopaStock = useMemo(() => {
        return Object.values(sizesStock).reduce((sum, val) => sum + (Number(val) || 0), 0);
      }, [sizesStock]);

      const handleSave = (e) => {
        e.preventDefault();

        if (!sku.trim()) {
          showToast('El código/SKU es obligatorio', 'error');
          return;
        }

        const isDuplicateSku = products.some(
          p => p.sku.trim().toUpperCase() === sku.trim().toUpperCase() && (!editingProduct || p.id !== editingProduct.id)
        );
        if (isDuplicateSku) {
          showToast(`El código "${sku}" ya existe en la base de datos`, 'error');
          return;
        }

        const numCost = Number(cost);
        const numPrice = Number(price);
        const finalStock = category === 'ropa' ? calculatedRopaStock : Number(simpleStock) || 0;

        const productPayload = {
          id: editingProduct ? editingProduct.id : `prod-${Date.now()}`,
          sku: sku.trim().toUpperCase(),
          name: name.trim(),
          category: category,
          subcategory: subcategory,
          color: color.trim(),
          material: material.trim(),
          cost: numCost,
          price: numPrice,
          stock: finalStock,
          sizes: category === 'ropa' ? sizesStock : null,
          createdAt: editingProduct ? editingProduct.createdAt : new Date().toISOString()
        };

        if (editingProduct) {
          setProducts(products.map(p => p.id === editingProduct.id ? productPayload : p));
          showToast(`Producto "${name}" actualizado`, 'success');
        } else {
          setProducts([productPayload, ...products]);
          showToast(`Producto "${name}" registrado exitosamente`, 'success');
        }

        onClose();
      };

      return (
        <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 overflow-y-auto">
          <div className="bg-white rounded-3xl max-w-2xl w-full p-6 border border-stone-200 shadow-2xl my-8">
            <div className="flex items-center justify-between pb-4 border-b border-stone-200">
              <h3 className="text-lg font-black text-stone-900">
                {editingProduct ? 'Editar Producto en Inventario' : 'Registro de Nuevo Producto'}
              </h3>
              <button onClick={onClose} className="text-stone-400">
                <Icon name="x" className="w-5 h-5" />
              </button>
            </div>

            <form onSubmit={handleSave} className="py-4 space-y-4">
              <div>
                <label className="block text-xs font-bold text-stone-700 uppercase mb-1.5">Categoría:</label>
                <div className="grid grid-cols-2 sm:grid-cols-4 gap-2">
                  {Object.values(CATEGORIES).map((cat) => (
                    <button
                      type="button"
                      key={cat.id}
                      onClick={() => handleCategoryChange(cat.id)}
                      className={`p-2.5 rounded-xl border text-xs font-bold transition flex flex-col items-center justify-center space-y-1 ${
                        category === cat.id ? 'bg-brand-800 text-white border-brand-900' : 'bg-stone-50 text-stone-700'
                      }`}
                    >
                      <Icon name={cat.icon} className="w-4 h-4" />
                      <span>{cat.name}</span>
                    </button>
                  ))}
                </div>
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                <div>
                  <label className="block text-xs font-bold text-stone-700 uppercase mb-1">Código / SKU: *</label>
                  <input
                    type="text"
                    required
                    value={sku}
                    onChange={(e) => setSku(e.target.value.toUpperCase())}
                    className="w-full px-3 py-2 rounded-xl border border-stone-300 text-xs font-mono font-bold uppercase bg-stone-50"
                  />
                </div>
                <div className="sm:col-span-2">
                  <label className="block text-xs font-bold text-stone-700 uppercase mb-1">Nombre del Producto: *</label>
                  <input
                    type="text"
                    required
                    value={name}
                    onChange={(e) => setName(e.target.value)}
                    className="w-full px-3 py-2 rounded-xl border border-stone-300 text-xs font-semibold"
                  />
                </div>
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                  <label className="block text-xs font-bold text-stone-700 uppercase mb-1">Material (ej. Cuero vacuno): *</label>
                  <input
                    type="text"
                    required
                    value={material}
                    onChange={(e) => setMaterial(e.target.value)}
                    className="w-full px-3 py-2 rounded-xl border border-stone-300 text-xs"
                  />
                </div>
                <div>
                  <label className="block text-xs font-bold text-stone-700 uppercase mb-1">Color: *</label>
                  <input
                    type="text"
                    required
                    value={color}
                    onChange={(e) => setColor(e.target.value)}
                    className="w-full px-3 py-2 rounded-xl border border-stone-300 text-xs"
                  />
                </div>
              </div>

              <div className="grid grid-cols-2 gap-3 bg-stone-50 p-3.5 rounded-2xl border border-stone-200">
                <div>
                  <label className="block text-xs font-bold text-stone-700 uppercase mb-1">Costo de Taller (Bs.): *</label>
                  <input
                    type="number"
                    step="0.50"
                    min="0"
                    required
                    value={cost}
                    onChange={(e) => setCost(e.target.value)}
                    className="w-full px-3 py-2 rounded-xl border border-stone-300 text-xs font-bold bg-white"
                  />
                </div>
                <div>
                  <label className="block text-xs font-bold text-stone-700 uppercase mb-1">Precio Venta (Bs.): *</label>
                  <input
                    type="number"
                    step="0.50"
                    min="0"
                    required
                    value={price}
                    onChange={(e) => setPrice(e.target.value)}
                    className="w-full px-3 py-2 rounded-xl border border-stone-300 text-xs font-black text-brand-900 bg-white"
                  />
                </div>
              </div>

              {category === 'ropa' ? (
                <div className="bg-amber-50/60 p-3.5 rounded-2xl border border-amber-200">
                  <div className="flex justify-between items-center mb-2">
                    <span className="text-xs font-bold text-brand-900 uppercase">Stock por Talla (XS a XXL):</span>
                    <span className="text-xs font-black text-brand-800 bg-white px-2 py-0.5 rounded-md border border-amber-300">
                      Total: {calculatedRopaStock} un.
                    </span>
                  </div>
                  <div className="grid grid-cols-6 gap-2">
                    {CATEGORIES.ropa.sizes.map((sz) => (
                      <div key={sz} className="text-center">
                        <span className="text-[11px] font-black text-stone-700 block mb-1">{sz}</span>
                        <input
                          type="number"
                          min="0"
                          value={sizesStock[sz] || 0}
                          onChange={(e) => {
                            const val = Math.max(0, parseInt(e.target.value) || 0);
                            setSizesStock({ ...sizesStock, [sz]: val });
                          }}
                          className="w-full text-center px-1 py-1.5 rounded-lg border border-amber-300 font-bold text-xs bg-white"
                        />
                      </div>
                    ))}
                  </div>
                </div>
              ) : (
                <div>
                  <label className="block text-xs font-bold text-stone-700 uppercase mb-1">Stock Disponible: *</label>
                  <input
                    type="number"
                    min="0"
                    required
                    value={simpleStock}
                    onChange={(e) => setSimpleStock(Math.max(0, parseInt(e.target.value) || 0))}
                    className="w-full px-3 py-2 rounded-xl border border-stone-300 text-xs font-bold"
                  />
                </div>
              )}

              <div className="flex space-x-3 pt-3 border-t border-stone-200">
                <button
                  type="button"
                  onClick={onClose}
                  className="flex-1 py-2.5 rounded-xl border border-stone-300 text-stone-700 font-bold text-xs"
                >
                  Cancelar
                </button>
                <button
                  type="submit"
                  className="flex-1 py-2.5 rounded-xl bg-brand-800 text-white font-bold text-xs shadow-md"
                >
                  Guardar en la Nube
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // Modal quick stock adjust
    function StockAdjustmentModal({ product, products, setProducts, onClose, showToast }) {
      const [type, setType] = useState('add');
      const [quantity, setQuantity] = useState(1);
      const [sizeToAdjust, setSizeToAdjust] = useState(product.category === 'ropa' ? 'M' : null);

      const handleConfirm = () => {
        const qty = Number(quantity);
        if (isNaN(qty) || qty <= 0) return;

        const delta = type === 'add' ? qty : -qty;

        const updatedProducts = products.map(p => {
          if (p.id !== product.id) return p;

          let newStock = p.stock;
          let newSizes = p.sizes ? { ...p.sizes } : null;

          if (product.category === 'ropa' && sizeToAdjust) {
            newSizes[sizeToAdjust] = Math.max(0, (newSizes[sizeToAdjust] || 0) + delta);
            newStock = Object.values(newSizes).reduce((sum, val) => sum + val, 0);
          } else {
            newStock = Math.max(0, newStock + delta);
          }

          return { ...p, stock: newStock, sizes: newSizes };
        });

        setProducts(updatedProducts);
        showToast(`Stock actualizado para ${product.name}`, 'success');
        onClose();
      };

      return (
        <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-white rounded-3xl max-w-sm w-full p-6 border border-stone-200 shadow-2xl space-y-4">
            <h3 className="text-base font-black text-stone-900">Ajuste de Stock (Taller)</h3>
            <p className="text-xs text-stone-500">{product.name} ({product.sku})</p>

            <div className="grid grid-cols-2 gap-2">
              <button
                type="button"
                onClick={() => setType('add')}
                className={`py-2 rounded-xl text-xs font-bold ${type === 'add' ? 'bg-emerald-700 text-white' : 'bg-stone-100 text-stone-700'}`}
              >
                + Entrada
              </button>
              <button
                type="button"
                onClick={() => setType('subtract')}
                className={`py-2 rounded-xl text-xs font-bold ${type === 'subtract' ? 'bg-red-700 text-white' : 'bg-stone-100 text-stone-700'}`}
              >
                - Salida / Merma
              </button>
            </div>

            {product.category === 'ropa' && (
              <div>
                <label className="block text-xs font-bold text-stone-700 mb-1">Talla a modificar:</label>
                <select
                  value={sizeToAdjust}
                  onChange={(e) => setSizeToAdjust(e.target.value)}
                  className="w-full px-3 py-2 rounded-xl border border-stone-300 text-xs font-semibold bg-stone-50"
                >
                  {CATEGORIES.ropa.sizes.map(sz => (
                    <option key={sz} value={sz}>Talla {sz}</option>
                  ))}
                </select>
              </div>
            )}

            <div>
              <label className="block text-xs font-bold text-stone-700 mb-1">Cantidad:</label>
              <input
                type="number"
                min="1"
                value={quantity}
                onChange={(e) => setQuantity(Math.max(1, parseInt(e.target.value) || 1))}
                className="w-full px-3 py-2 rounded-xl border border-stone-300 text-sm font-black"
              />
            </div>

            <div className="flex space-x-2 pt-2">
              <button type="button" onClick={onClose} className="flex-1 py-2.5 rounded-xl border border-stone-300 text-xs font-bold">Cancelar</button>
              <button type="button" onClick={handleConfirm} className="flex-1 py-2.5 rounded-xl bg-brand-800 text-white text-xs font-bold">Aplicar</button>
            </div>
          </div>
        </div>
      );
    }

          sale.items.forEach(item => {
            totalWorkshopCost += (item.unitCost || 0) * item.quantity;
            totalItemsSold += item.quantity;
          });
        });

        const grossProfit = totalRevenue - totalWorkshopCost;
        const grossMarginPct = totalRevenue > 0 ? (grossProfit / totalRevenue) * 100 : 0;
        const ticketAverage = validSales.length > 0 ? totalRevenue / validSales.length : 0;

        return {
          totalRevenue,
          totalWorkshopCost,
          grossProfit,
          grossMarginPct,
          totalItemsSold,
          transactionCount: validSales.length,
          ticketAverage
        };

        const map = {};
        validSales.forEach(sale => {
          const dayKey = sale.date.slice(0, 10);

              dateKey: dayKey,
              displayDate: formatDateOnly(sale.date),
              count: 0,
              itemsCount: 0,
              revenue: 0,
              cost: 0,
              profit: 0
